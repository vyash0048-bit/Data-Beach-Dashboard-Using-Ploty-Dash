<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#060810" />
  
  <!-- Scanline -->
  <rect width="800" height="2" fill="#00d4ff" fill-opacity="0.2">
    <animate attributeName="y" from="0" to="150" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Title -->
  <text x="50%" y="70" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="42" fill="#00d4ff" style="letter-spacing: 8px;">
    CYBER INTELLIGENCE
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </text>

  <!-- Subtitle -->
  <text x="50%" y="110" text-anchor="middle" font-family="monospace" font-size="14" fill="#555" style="letter-spacing: 4px;">
    DATA BREACH ANALYTICS PLATFORM
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" />
  </text>

  <!-- Decorative Corners -->
  <polyline points="20,40 20,20 40,20" fill="none" stroke="#00d4ff" stroke-width="2" />
  <polyline points="760,20 780,20 780,40" fill="none" stroke="#00d4ff" stroke-width="2" />
  <polyline points="20,110 20,130 40,130" fill="none" stroke="#00d4ff" stroke-width="2" />
  <polyline points="760,130 780,130 780,110" fill="none" stroke="#00d4ff" stroke-width="2" />
</svg>
