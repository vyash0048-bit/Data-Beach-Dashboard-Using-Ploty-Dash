<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#060810" />
  
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Scanline Animation -->
  <rect width="800" height="2" fill="#00d4ff" opacity="0.15">
    <animate attributeName="y" from="-2" to="150" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Main Title -->
  <text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" 
        fill="#00d4ff" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" font-size="42" letter-spacing="8" filter="url(#glow)">
    CYBER INTELLIGENCE
    <!-- Flicker effect using SMIL -->
    <animate attributeName="opacity" values="1;1;0.4;1;1;0.3;1;1" dur="4s" repeatCount="indefinite" />
  </text>

  <!-- Subtitle -->
  <text x="50%" y="75%" dominant-baseline="middle" text-anchor="middle" 
        fill="#444" font-family="monospace" font-size="14" letter-spacing="4">
    DATA BREACH ANALYTICS PLATFORM
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
  </text>

  <!-- Border Accents -->
  <rect x="10" y="10" width="30" height="2" fill="#00d4ff" />
  <rect x="10" y="10" width="2" height="30" fill="#00d4ff" />
  
  <rect x="760" y="110" width="30" height="2" fill="#00d4ff" />
  <rect x="788" y="110" width="2" height="30" fill="#00d4ff" />
</svg>
